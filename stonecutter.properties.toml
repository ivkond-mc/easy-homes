# Centralized properties for every version node.
# https://stonecutter.kikugie.dev/wiki/v2/reference/gradle-api/structured-properties

mod.id = "easy_homes"
mod.name = "Easy Homes"
mod.description = "Easy and lightweight /sethome mod"
mod.author = "ivkond"
mod.sources = "https://github.com/ivkond-mc/simple-homes"
# Single mod version for all Minecraft versions; the node's MC version is appended by the build scripts
mod.version = "1.0.1"
mod.modrinth_id = "w4Z2NKqf"
mod.curseforge_id = "1163866"

# loom-back-compat applies fabric-loom-remap (obfuscated, <26.1) or fabric-loom (unobfuscated, 26.1+).
# 1.18.x is required for MC 26.1: it bundles ASM 9.10 which can read Java 25 class files
# (loom 1.16.3 silently drops all classes while merging, producing a resources-only jar).
loomx.loom_version = "1.18.4"

["1.18.2"]
mod.mc_releases = ["1.18.2"]
deps.fabric_loader = "0.14.22"
deps.fabric_api = "0.77.0+1.18.2"
# MidnightLib 0.4.4 (last 1.18.2 build) ships a single fabric/quilt jar whose
# Modrinth version number has no loader suffix, hence the full coordinate here
deps.midnightlib = "maven.modrinth:midnightlib:0.4.4"
deps.modmenu = "3.2.5"

[fabric."1.18.2"]
mod.mc_compat = ">=1.18.2 <1.19"
["1.19.2"]
mod.mc_releases = ["1.19.2"]
deps.fabric_loader = "0.14.25"
deps.fabric_api = "0.77.0+1.19.2"
