pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.firstdark.dev/releases' }
        maven { url = 'https://maven.kikugie.dev/releases' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    id 'dev.kikugie.loom-back-compat' version '0.4.2'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
    kotlinController = false
    create(rootProject) {
        // Legacy nodes below 1.21.1 are Fabric-only (no NeoForge for those MC versions)
        for (mc in ['1.18.2', '1.19.2', '1.19.4', '1.20.1', '1.21.1', '1.21.4', '1.21.5', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1.2', '26.2', '26.3']) {
            version("${mc}-fabric", mc).buildscript("build.fabric.gradle")
        }
        for (mc in ['1.21.1', '1.21.4', '1.21.5', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1.2', '26.2', '26.3']) {
            version("${mc}-neoforge", mc).buildscript("build.neoforge.gradle")
        }
        vcsVersion = '26.1.2-fabric'
    }
}

rootProject.name = 'easy_homes'
