name: Game tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gametests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # One job per node: a failure names the exact MC version + loader
        node:
          - 1.21.4-fabric
          - 1.21.4-neoforge
          - 1.21.5-fabric
          - 1.21.5-neoforge
          - 1.21.9-fabric
          - 1.21.9-neoforge
          - 1.21.10-fabric
          - 1.21.10-neoforge
          - 1.21.11-fabric
          - 1.21.11-neoforge
          - 26.1.2-fabric
          - 26.1.2-neoforge

    steps:
    - uses: actions/checkout@v4

    # MC 1.21.x nodes compile on Java 21, 26.1 needs Java 25 (toolchains fetch it)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

    - name: Run game tests (${{ matrix.node }})
      run: ./gradlew :${{ matrix.node }}:runGameTestServer

    - name: Upload test report
      if: always() && matrix.node == '26.1.2-fabric'
      uses: actions/upload-artifact@v4
      with:
        name: gametest-report
        path: versions/26.1.2-fabric/build/reports/gametest/gametest.xml
        if-no-files-found: ignore
