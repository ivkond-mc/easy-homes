name: CF file check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query CurseForge for file registration
        run: |
          for id in 9131517 9131518 9131519; do
            echo "=== file $id"
            curl -sS -o /tmp/resp.json -w "http=%{http_code}\n" \
              -H "x-api-key: ${{ secrets.CURSEFORGE_TOKEN }}" \
              -H "Accept: application/json" \
              "https://api.curseforge.com/v1/mods/1163866/files/$id"
            head -c 400 /tmp/resp.json; echo
          done
          echo "=== files list probe"
          curl -sS -o /tmp/list.json -w "http=%{http_code}\n" \
            -H "x-api-key: ${{ secrets.CURSEFORGE_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.curseforge.com/v1/mods/1163866/files?index=0&pageSize=60"
          head -c 400 /tmp/list.json; echo
