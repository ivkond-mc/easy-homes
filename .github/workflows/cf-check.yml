name: CF file check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query CurseForge for file registration
        run: |
          for id in 9131517 9131518 9131519; do
            echo "=== file $id"
            curl -fsS -H "x-api-key: ${{ secrets.CURSEFORGE_TOKEN }}" \
              -H "Accept: application/json" \
              "https://api.curseforge.com/v1/mods/1163866/files/$id" \
              | jq '{id: .data.id, displayName: .data.displayName, status: .data.status, gameVersions: .data.gameVersions}'
          done
          echo "=== total 1.0.1 files on CurseForge"
          curl -fsS -H "x-api-key: ${{ secrets.CURSEFORGE_TOKEN }}" \
            -H "Accept: application/json" \
            "https://api.curseforge.com/v1/mods/1163866/files?index=0&pageSize=60" \
            | jq '[.data[] | select(.displayName | contains("1.0.1"))] | length'
