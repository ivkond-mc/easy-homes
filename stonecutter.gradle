plugins {
    id 'dev.kikugie.stonecutter'
}

stonecutter.active('26.1.2-fabric') /* [SC] DO NOT EDIT */

// https://stonecutter.kikugie.dev/wiki/v2/reference/gradle-api/project-controller
stonecutter.parameters {
    def (mcVersion, loader) = current.project.split('-', 2)
    properties { tags(mcVersion, loader) }
    constants { match(loader, 'fabric', 'neoforge') }

    replacements {
        // MC 1.21.11 renamed ResourceLocation to Identifier and ResourceKey.location() to identifier().
        // Sources are stored in the new spelling; older versions are downgraded at generation time.
        string(current.parsed < '1.21.11') {
            replace('Identifier', 'ResourceLocation')
            replace('levelResourceKey.identifier()', 'levelResourceKey.location()')
            replace('dimension().identifier()', 'dimension().location()')
        }

        // ResourceLocation.parse only exists since 1.20.5
        string(current.parsed < '1.20.5') {
            replace('Identifier.parse(', 'new ResourceLocation(')
        }
        // Longer-match resolution: the rule above shadows the plain Identifier
        // rule inside Identifier.parse(...) segments even when inactive, so the
        // 1.20.5..1.21.10 range needs its own explicit spelling
        string(current.parsed < '1.21.11' && current.parsed >= '1.20.5') {
            replace('Identifier.parse(', 'ResourceLocation.parse(')
        }

        // Entity#level() was getLevel() before 1.20
        string(current.parsed < '1.20') {
            replace('player.level()', 'player.getLevel()')
        }
        // MC 1.19 renamed/added several mojmap members the sources rely on
        string(current.parsed < '1.19') {
            replace('SoundEvents.PLAYER_TELEPORT', 'SoundEvents.CHORUS_FRUIT_TELEPORT')
        }
        // BlockPos.containing and the per-wood EntityType boat constants came later
        string(current.parsed < '1.19.4') {
            replace('BlockPos.containing(', 'new BlockPos(')
            replace('EntityType.OAK_BOAT', 'EntityType.BOAT')
        }
        // Duration.isPositive needs Java 18; legacy nodes build with Java 17
        // (compareTo keeps ZERO cooldown treated as expired, unlike !isNegative)
        string(current.parsed < '1.20.5') {
            replace('cooldown.isPositive()', 'cooldown.compareTo(java.time.Duration.ZERO) > 0')
        }
    }
}

// Builds every version x loader node (Stonecutter pre-processes the shared sources per node)
tasks.register('chiseledBuild') {
    group = 'build'
    dependsOn stonecutter.tasks.named('build')
}

// Builds and uploads every node to Modrinth/CurseForge (requires MODRINTH_TOKEN/CURSE_TOKEN)
tasks.register('publishAll') {
    group = 'publishing'
    dependsOn stonecutter.tasks.named('publishMod')
    doLast { println('All mods have been successfully uploaded') }
}
